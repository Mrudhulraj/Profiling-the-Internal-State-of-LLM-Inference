apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
    spec:
      initContainers:
      - name: uds-tokenizer
        # UPDATED: Use the exact tag from your crictl output
        image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.6.0
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        env:
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: PROBE_PORT
          value: "8082"
        - name: HF_TOKEN
          value: # Replace with your actual HF token if needed
        ports:
        - name: health
          containerPort: 8082
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uds-socket
          mountPath: /tmp/tokenizer
      containers:
      - name: vllm-sim
        # UPDATED: Use the exact tag from your crictl output
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        command: ["/mnt/llm-d-inference-sim"]
        imagePullPolicy: IfNotPresent
        args:
        - "--model"
        - "/mnt/c/Users/mrudh/Desktop/model-compressor/TinyLlama-Pruned-50" # Hardcoded model name
        - "--port"
        - "8000"
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        volumeMounts:
        - name: uds-socket
          mountPath: /tmp/tokenizer
        - name: newbin
          mountPath: /mnt/llm-d-inference-sim
          # type: File
          # subPath: llm-d-inference-sim
      volumes:
      - name: uds-socket
        emptyDir: {}
      - name: newbin
        hostPath:
          path: /mnt/llm-d-inference-sim
          type: File
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    networking.istio.io/service-type: NodePort
  name: vllm-sim
  labels:
    app: vllm-sim
    networking.istio.io/service-type: NodePort
spec:
  type: NodePort
  selector:
    app: vllm-sim
  ports:
    - appProtocol: http
      protocol: TCP
      name: default
      port: 8000
      targetPort: 8000
      # UPDATED: Use a standard NodePort in the 30000-32767 range
      nodePort: 30080